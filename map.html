<title>AgenticAI · Connection graph and workflow</title>
<style>
:root{--bg:#071a33;--line:#2b6cb0;--ink:#e6f4ff;--dim:#8fb4d9;--cy:#7fd1ff;--am:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
header{padding:14px 20px 4px}h1{font-size:17px;margin:0 0 2px}.note{color:var(--dim);font-size:12px;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 20px;align-items:center}
.bar button,.steps button{background:#0b2748;color:var(--ink);border:1.5px solid var(--line);border-radius:3px;font:inherit;padding:4px 10px;cursor:pointer}
.bar button[aria-pressed=true],.steps button[aria-pressed=true]{background:#17508f;border-color:var(--cy)}
button:focus-visible,.node:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.steps{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 8px}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;padding:0 20px 24px;align-items:start}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.gw{border:1.5px solid var(--line);border-radius:4px;overflow-x:auto;background:rgba(7,26,51,.6)}
svg{display:block;min-width:900px;width:100%;height:auto}
.side{background:#0b2748;border:1.5px solid var(--line);border-radius:4px;padding:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.side h2{font-size:15px;margin:0 0 2px;word-break:break-all}.side .path{color:var(--dim);font-size:12px;margin:0 0 8px}
.side h3{font-size:12px;color:var(--cy);margin:12px 0 4px}.side p{margin:0 0 6px}.side ul{margin:0;padding-left:18px}.side li{margin-bottom:3px}
.tag{display:inline-block;border:1.5px solid;border-radius:3px;padding:0 7px;font-size:12px;margin-bottom:8px}
.lk{background:none;border:0;color:var(--am);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.node{cursor:pointer}.node rect{stroke-width:1.6}.node:hover rect{filter:brightness(1.3)}.node.sel rect{stroke:#fff;stroke-width:3}
.nt{font-size:12px;font-weight:700;fill:var(--ink)}.ns{font-size:10px;fill:var(--dim)}
.ed{fill:none;stroke:#7fd1ff;stroke-width:1.5;opacity:.7}.ed.dash{stroke-dasharray:6 4}
.ed.hi{stroke:#ffd166;stroke-width:2.6;opacity:1}.ed.dim,.node.dim,.lb.dim,.bd.dim{opacity:.12}
.ed.flow{stroke-dasharray:8 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}
@media(prefers-reduced-motion:reduce){.ed.flow{animation:none}}
.lb{font-size:10.5px;fill:#bfe6ff;paint-order:stroke;stroke:#071a33;stroke-width:4px;stroke-linejoin:round}
.bd circle{fill:#ffd166}.bd text{font-size:10px;font-weight:700;fill:#071a33;text-anchor:middle}
.lane{font-size:12px;font-weight:700;fill:var(--cy)}
</style></head><body>

<p class="note">Click a file to see what it does. Pick a workflow, then a step, to see which files and data flows it uses. Arrows show what flows; double arrows are request and response.</p></header>
